<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Astronômicos 2025</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/jsj2psy.css">
    <script src="js/scripts.js" defer></script>

</head>

<body>
    <div class="container">
        <header>
            <div class="header-container">
                <i class="fas fa-calendar-alt calendar-icon"></i>
                <h1>Calendário de Eventos Astronômicos 2025</h1>
            </div>
            <div class="filters" id="filters">
                <i class="fas fa-list" title="Filtros"></i>
                <select class="filter-select" id="filter-select">
                    <option value="all">Todos</option>
                    <option value="meteors">Chuva de Meteoros</option>
                    <option value="planets">Planetas</option>
                    <option value="moon">Lua</option>
                    <option value="favorite">Favoritos</option>
                </select>
            </div>
        </header>
        <div class="main" id="main">
        </div>

        <!-- Modal -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close-button" onclick="closeModal()">&times;</span>
                <h2 id="modal-title"></h2>
                <p class="modal-date" id="modal-date"></p>
                <div class="modal-infos">
                    <p id="modal-details"></p>
                    <p id="modal-observation"></p>
                    <p id="modal-visibility"></p>
                    <p id="modal-photography"></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
